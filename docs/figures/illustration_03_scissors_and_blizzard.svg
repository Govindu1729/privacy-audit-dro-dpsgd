<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5EFE2"/>
    </linearGradient>
    <linearGradient id="blizzard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCE3EA" stop-opacity="0.93"/>
      <stop offset="100%" stop-color="#B8C4D0" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <rect width="960" height="440" rx="14" fill="url(#warmBg3)" stroke="#DFD5C3" stroke-width="2"/>

  <!-- Header -->
  <text x="480" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2C2A29">
    ACT III: WHY NAIVE PRIVACY + FAIRNESS CLASHES
  </text>
  <text x="480" y="56" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#6E655F">
    "Fairness tries to give minorities a megaphone; Privacy chops off loud voices with hedge shears and fills the room with snow."
  </text>

  <!-- ==================== STEP 1: THE CLIPPING SCISSORS ==================== -->
  <g transform="translate(25, 78)">
    <rect width="440" height="335" rx="10" fill="#FAF6EE" stroke="#C8BFA8" stroke-width="1.5"/>
    <rect x="18" y="14" width="404" height="30" rx="6" fill="#5A6875"/>
    <text x="220" y="34" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">
      PROBLEM A: The "Privacy Ceiling" Chops Off the Boost!
    </text>

    <!-- Majority Short Bars -->
    <g transform="translate(45, 165)">
      <rect x="0" y="35" width="32" height="55" rx="4" fill="#528A91" stroke="#2C2A29" stroke-width="1.5"/>
      <circle cx="16" cy="22" r="9" fill="#528A91" stroke="#2C2A29" stroke-width="1.5"/>
      <rect x="48" y="42" width="32" height="48" rx="4" fill="#528A91" stroke="#2C2A29" stroke-width="1.5"/>
      <circle cx="64" cy="29" r="9" fill="#528A91" stroke="#2C2A29" stroke-width="1.5"/>
      <text x="40" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#3B6E75" font-weight="bold">Majority Voices</text>
      <text x="40" y="124" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#6E655F">(Below the ceiling)</text>
    </g>

    <!-- Minority Tall Pedestals Being Chopped! -->
    <g transform="translate(205, 85)">
      <!-- Ghosted Chopped-Off Top Part (What DRO wanted) -->
      <rect x="20" y="-15" width="40" height="65" rx="4" fill="#F4A261" opacity="0.35" stroke="#D95D39" stroke-width="1.8" stroke-dasharray="4,4"/>
      <rect x="95" y="-25" width="40" height="75" rx="4" fill="#F4A261" opacity="0.35" stroke="#D95D39" stroke-width="1.8" stroke-dasharray="4,4"/>
      <text x="78" y="-30" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="10" font-weight="bold" fill="#D95D39">
        Fairness Boost (CHOPPED OFF!)
      </text>

      <!-- Remaining Clipped Pedestal Below Line -->
      <rect x="20" y="55" width="40" height="115" rx="2" fill="#D95D39" stroke="#2C2A29" stroke-width="1.8"/>
      <circle cx="40" cy="72" r="10" fill="#FFF" stroke="#2C2A29" stroke-width="1.5"/>
      
      <rect x="95" y="55" width="40" height="115" rx="2" fill="#D95D39" stroke="#2C2A29" stroke-width="1.8"/>
      <circle cx="115" cy="72" r="10" fill="#FFF" stroke="#2C2A29" stroke-width="1.5"/>

      <text x="78" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#D95D39" font-weight="bold">Minority Voices</text>
      <text x="78" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#9E2A2B">(Pinned flat at the ceiling!)</text>
    </g>

    <!-- THE RED CLIPPING CEILING LINE & SCISSORS -->
    <line x1="25" y1="140" x2="415" y2="140" stroke="#9E2A2B" stroke-width="3" stroke-dasharray="8,5"/>
    <rect x="30" y="114" width="155" height="22" rx="4" fill="#9E2A2B"/>
    <text x="107" y="129" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="10.5" font-weight="bold" fill="#FFFFFF">
      ✂️ DP CLIPPING CEILING
    </text>

    <!-- Giant Scissors Icon -->
    <g transform="translate(182, 125)">
      <circle cx="0" cy="-6" r="7" fill="none" stroke="#2C2A29" stroke-width="2.5"/>
      <circle cx="0" cy="10" r="7" fill="none" stroke="#2C2A29" stroke-width="2.5"/>
      <line x1="6" y1="-3" x2="32" y2="8" stroke="#2C2A29" stroke-width="3" stroke-linecap="round"/>
      <line x1="6" y1="7" x2="32" y2="-4" stroke="#2C2A29" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Explanation Footer -->
    <text x="220" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="11.5" fill="#2C2A29">
      The shears cut off the fairness boost, <tspan font-weight="bold" fill="#9E2A2B">AND</tspan> every minority
    </text>
    <text x="220" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="11.5" fill="#2C2A29">
      is still squished right against the ceiling line!
    </text>
  </g>

  <!-- ==================== STEP 2: THE TWO FOG REGIMES ==================== -->
  <g transform="translate(495, 78)">
    <rect width="440" height="335" rx="10" fill="#FAF6EE" stroke="#C8BFA8" stroke-width="1.5"/>
    <rect x="18" y="14" width="404" height="30" rx="6" fill="#2C2A29"/>
    <text x="220" y="34" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13.5" font-weight="bold" fill="#F4B942">
      PROBLEM B: The Privacy Fog Dilemma
    </text>

    <!-- Top Half: Light Fog (Epsilon = 8) -->
    <g transform="translate(22, 58)">
      <rect width="396" height="122" rx="8" fill="#FFFFFF" stroke="#D9822B" stroke-width="1.8"/>
      <text x="15" y="22" font-family="Trebuchet MS, sans-serif" font-size="12" font-weight="bold" fill="#D9822B">
        Scenario 1: Light Privacy Fog (Moderate DP, ε = 8)
      </text>

      <!-- Silhouettes in light mist -->
      <rect x="35" y="65" width="24" height="40" fill="#528A91" opacity="0.6"/>
      <rect x="70" y="70" width="24" height="35" fill="#528A91" opacity="0.6"/>
      
      <!-- Minority still clearly visible at the top ceiling -->
      <rect x="135" y="35" width="28" height="70" fill="#D95D39"/>
      <circle cx="149" cy="48" r="7" fill="#FFF"/>
      <rect x="175" y="35" width="28" height="70" fill="#D95D39"/>
      <circle cx="189" cy="48" r="7" fill="#FFF"/>
      
      <!-- Light mist overlay -->
      <rect x="20" y="32" width="200" height="75" fill="#DCE3EA" opacity="0.38" rx="6"/>

      <text x="305" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#9E2A2B" font-weight="bold">
        ❌ Still Leaks!
      </text>
      <text x="305" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" fill="#2C2A29">
        The mist is too thin—minorities
      </text>
      <text x="305" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" fill="#2C2A29">
        still stick out at the ceiling.
      </text>
    </g>

    <!-- Bottom Half: Thick Blizzard (Epsilon <= 4) -->
    <g transform="translate(22, 194)">
      <rect width="396" height="122" rx="8" fill="url(#blizzard)" stroke="#5A6875" stroke-width="1.8"/>
      <text x="15" y="22" font-family="Trebuchet MS, sans-serif" font-size="12" font-weight="bold" fill="#2C2A29">
        Scenario 2: Heavy Blizzard (Strict DP, ε ≤ 4)
      </text>

      <!-- Snowflakes / Noise dots -->
      <g fill="#FFFFFF" opacity="0.9">
        <circle cx="45" cy="55" r="4"/><circle cx="85" cy="45" r="5"/><circle cx="125" cy="75" r="4"/><circle cx="65" cy="90" r="6"/>
        <circle cx="155" cy="50" r="5"/><circle cx="190" cy="85" r="5"/><circle cx="110" cy="48" r="4"/><circle cx="170" cy="68" r="6"/>
      </g>
      <text x="115" y="75" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" font-weight="bold" fill="#4A5664">
        ❄️ TOTAL WHITE-OUT ❄️
      </text>

      <text x="305" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2E7D32" font-weight="bold">
        ✅ Privacy Saved...
      </text>
      <text x="305" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#9E2A2B" font-weight="bold">
        ❌ ...But Fairness Dies!
      </text>
      <text x="305" y="87" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" fill="#2C2A29">
        The snow is so thick the AI goes
      </text>
      <text x="305" y="101" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" fill="#2C2A29">
        blind to minorities again.
      </text>
    </g>
  </g>
</svg>