<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="skyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F3E8"/>
      <stop offset="100%" stop-color="#EDE4D3"/>
    </linearGradient>
    <linearGradient id="fogLayer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#D5D9DF" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="960" height="430" rx="14" fill="url(#skyBg)" stroke="#DFD5C3" stroke-width="2"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2C2A29">
    ACT II: WHY SMALLER GROUPS LEAK THE MOST PRIVACY
  </text>
  <text x="480" y="56" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#6E655F">
    "To balance the scale of justice, a tiny group must stand on giant pedestals—pushing their heads right above the privacy fog."
  </text>

  <!-- Privacy Fog Line Across the Whole Scene -->
  <rect x="40" y="185" width="880" height="95" rx="12" fill="url(#fogLayer)" stroke="#B0B8C1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="480" y="212" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="12" font-weight="bold" fill="#5A6875" letter-spacing="1.5">
    ☁️  THE "ANONYMITY CLOUD" (SAFE BLENDING ZONE)  ☁️
  </text>

  <!-- ==================== LEFT SIDE: THE MAJORITY CROWD ==================== -->
  <g transform="translate(80, 150)">
    <!-- Label -->
    <rect x="30" y="-70" width="260" height="46" rx="8" fill="#E6F0F2" stroke="#3B6E75" stroke-width="1.5"/>
    <text x="160" y="-50" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" font-weight="bold" fill="#3B6E75">
      LARGE GROUP (10,000 People)
    </text>
    <text x="160" y="-33" text-anchor="middle" font-family="Georgia, serif" font-size="11.5" fill="#2C2A29">
      Each person carries a tiny <tspan font-weight="bold">1x</tspan> weight
    </text>

    <!-- Hundreds of small people safely inside the fog -->
    <g fill="#3B6E75" opacity="0.85">
      <!-- Row 1 -->
      <circle cx="55" cy="80" r="8"/><circle cx="80" cy="78" r="8"/><circle cx="105" cy="81" r="8"/><circle cx="130" cy="79" r="8"/>
      <circle cx="155" cy="80" r="8"/><circle cx="180" cy="77" r="8"/><circle cx="205" cy="80" r="8"/><circle cx="230" cy="79" r="8"/><circle cx="255" cy="81" r="8"/>
      <!-- Row 2 -->
      <circle cx="45" cy="100" r="9"/><circle cx="72" cy="98" r="9"/><circle cx="98" cy="101" r="9"/><circle cx="125" cy="99" r="9"/>
      <circle cx="152" cy="100" r="9"/><circle cx="178" cy="97" r="9"/><circle cx="205" cy="100" r="9"/><circle cx="232" cy="99" r="9"/><circle cx="260" cy="101" r="9"/>
      <!-- Bodies on the scale pan -->
      <rect x="35" y="110" width="235" height="22" rx="5" fill="#3B6E75"/>
    </g>

    <!-- Safe Badge -->
    <text x="155" y="25" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#3B6E75" font-weight="bold">
      🔒 Hidden safely inside the crowd!
    </text>
  </g>

  <!-- ==================== RIGHT SIDE: THE TINY MINORITY ON PEDESTALS ==================== -->
  <g transform="translate(540, 150)">
    <!-- Label -->
    <rect x="30" y="-70" width="280" height="46" rx="8" fill="#FDECEC" stroke="#D95D39" stroke-width="1.5"/>
    <text x="170" y="-50" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" font-weight="bold" fill="#D95D39">
      TINY MINORITY GROUP (Only 3 People)
    </text>
    <text x="170" y="-33" text-anchor="middle" font-family="Georgia, serif" font-size="11.5" fill="#2C2A29">
      Each person must carry a massive <tspan font-weight="bold" fill="#9E2A2B">50x</tspan> pedestal!
    </text>

    <!-- Giant Stone Pedestals (DRO Upweighting) -->
    <g stroke="#2C2A29" stroke-width="1.8">
      <!-- Pedestal 1 -->
      <rect x="85" y="15" width="32" height="117" fill="#E9C46A"/>
      <text x="101" y="85" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="10" font-weight="bold" fill="#2C2A29" transform="rotate(-90 101 85)">DRO BOOST</text>
      
      <!-- Pedestal 2 (Tallest Outlier) -->
      <rect x="154" y="-5" width="32" height="137" fill="#F4A261"/>
      <text x="170" y="75" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="10" font-weight="bold" fill="#2C2A29" transform="rotate(-90 170 75)">DRO BOOST</text>

      <!-- Pedestal 3 -->
      <rect x="223" y="10" width="32" height="122" fill="#E9C46A"/>
      <text x="239" y="85" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="10" font-weight="bold" fill="#2C2A29" transform="rotate(-90 239 85)">DRO BOOST</text>
    </g>

    <!-- 3 Minority Figures Pushed HIGH ABOVE the Privacy Fog! -->
    <g fill="#D95D39" stroke="#2C2A29" stroke-width="1.8">
      <!-- Person 1 -->
      <circle cx="101" cy="-14" r="10"/>
      <path d="M87,15 C87,-2 115,-2 115,15 Z"/>
      <!-- Person 2 -->
      <circle cx="170" cy="-34" r="10"/>
      <path d="M156,-5 C156,-22 184,-22 184,-5 Z"/>
      <!-- Person 3 -->
      <circle cx="239" cy="-19" r="10"/>
      <path d="M225,10 C225,-7 253,-7 253,10 Z"/>
    </g>

    <!-- Red Warning Halo around their exposed heads -->
    <ellipse cx="170" cy="-15" rx="95" ry="32" fill="none" stroke="#9E2A2B" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="330" y="-12" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11.5" font-weight="bold" fill="#9E2A2B">
      🚨 COMPLETELY
    </text>
    <text x="330" y="3" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11.5" font-weight="bold" fill="#9E2A2B">
      EXPOSED!
    </text>
  </g>

  <!-- ==================== THE GIANT SCALE OF FAIRNESS AT BOTTOM ==================== -->
  <g transform="translate(0, 280)">
    <!-- Left Pan -->
    <line x1="115" y1="2" x2="365" y2="2" stroke="#2C2A29" stroke-width="5" stroke-linecap="round"/>
    <line x1="240" y1="2" x2="240" y2="35" stroke="#2C2A29" stroke-width="5"/>
    <!-- Right Pan -->
    <line x1="585" y1="2" x2="835" y2="2" stroke="#2C2A29" stroke-width="5" stroke-linecap="round"/>
    <line x1="710" y1="2" x2="710" y2="35" stroke="#2C2A29" stroke-width="5"/>
    <!-- Main Balance Beam -->
    <line x1="240" y1="35" x2="710" y2="35" stroke="#2C2A29" stroke-width="7" stroke-linecap="round"/>
    <!-- Center Fulcrum Triangle -->
    <polygon points="475,35 445,95 505,95" fill="#D9822B" stroke="#2C2A29" stroke-width="2.5"/>
    <circle cx="475" cy="35" r="8" fill="#FDFBF7" stroke="#2C2A29" stroke-width="2.5"/>

    <rect x="335" y="102" width="280" height="32" rx="6" fill="#2C2A29"/>
    <text x="475" y="123" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" font-weight="bold" fill="#F4B942">
      ⚖️  THE SCALE OF FAIRNESS IS BALANCED!
    </text>
  </g>
</svg>