<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <linearGradient id="safeGlow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4EA8DE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4EA8DE" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" rx="14" fill="url(#bg4)" stroke="#DFD5C3" stroke-width="2"/>

  <!-- Header -->
  <text x="480" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2C2A29">
    ACT IV: THE SOLUTION — LIFT THE COMMUNITY, NOT THE LONE OUTLIER
  </text>
  <text x="480" y="56" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#6E655F">
    "Don't turn single individuals into lightning rods. Cap everyone's exposure first, then lift the whole group together."
  </text>

  <!-- ==================== LEFT: THE BROKEN WAY (NAIVE INSTANCE DRO) ==================== -->
  <g transform="translate(30, 78)">
    <rect width="430" height="295" rx="10" fill="#FDECEC" stroke="#D95D39" stroke-width="1.8"/>
    <rect x="20" y="14" width="390" height="28" rx="6" fill="#9E2A2B"/>
    <text x="215" y="33" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">
      ❌ NAIVE WAY: Turning Individuals into Lightning Rods
    </text>

    <!-- Storm Cloud & Lightning Hitting the Tallest Individual -->
    <path d="M175,65 Q195,50 220,60 Q245,48 265,65 Q280,75 265,88 L175,88 Q160,75 175,65 Z" fill="#5A6875"/>
    <polygon points="220,86 202,118 218,118 206,152 238,112 220,112" fill="#F4B942" stroke="#9E2A2B" stroke-width="1.2"/>

    <!-- Minority group where ONE quirky individual gets all the weight -->
    <g transform="translate(85, 145)">
      <!-- Normal group members neglected -->
      <circle cx="40" cy="70" r="10" fill="#D95D39" opacity="0.6"/>
      <rect x="28" y="82" width="24" height="30" rx="4" fill="#D95D39" opacity="0.6"/>

      <circle cx="85" cy="65" r="10" fill="#D95D39" opacity="0.6"/>
      <rect x="73" y="77" width="24" height="35" rx="4" fill="#D95D39" opacity="0.6"/>

      <!-- THE LONE OUTLIER ON A MASSIVE SPIKE -->
      <rect x="123" y="25" width="24" height="87" fill="#9E2A2B" stroke="#2C2A29" stroke-width="1.8"/>
      <circle cx="135" cy="10" r="12" fill="#D95D39" stroke="#2C2A29" stroke-width="2"/>
      
      <circle cx="185" cy="68" r="10" fill="#D95D39" opacity="0.6"/>
      <rect x="173" y="80" width="24" height="32" rx="4" fill="#D95D39" opacity="0.6"/>

      <circle cx="230" cy="72" r="10" fill="#D95D39" opacity="0.6"/>
      <rect x="218" y="84" width="24" height="28" rx="4" fill="#D95D39" opacity="0.6"/>

      <line x1="10" y1="112" x2="260" y2="112" stroke="#2C2A29" stroke-width="3"/>
    </g>

    <text x="215" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="11.5" fill="#2C2A29">
      Puts extreme weight on <tspan font-weight="bold" fill="#9E2A2B">one unusual person</tspan>, exposing them!
    </text>
  </g>

  <!-- ==================== RIGHT: THE PRINCIPLED WAY (JOINT DESIGN) ==================== -->
  <g transform="translate(500, 78)">
    <rect width="430" height="295" rx="10" fill="#EBF5F0" stroke="#2E7D32" stroke-width="1.8"/>
    <rect x="20" y="14" width="390" height="28" rx="6" fill="#2E7D32"/>
    <text x="215" y="33" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">
      ✅ JOINT DESIGN: Calm Voices + A Shared Umbrella
    </text>

    <!-- Protective Shared Umbrella Dome -->
    <path d="M75,135 C75,65 355,65 355,135 Z" fill="#3B6E75" stroke="#2C2A29" stroke-width="2.5"/>
    <path d="M75,135 C120,120 165,120 215,135 C265,120 310,120 355,135" fill="none" stroke="#2C2A29" stroke-width="2"/>
    <line x1="215" y1="83" x2="215" y2="215" stroke="#2C2A29" stroke-width="4"/>
    <text x="215" y="114" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">
      🛡️ SHARED PRIVACY SHIELD
    </text>

    <!-- All Minority Members Equal Height on a Shared Rising Platform -->
    <g transform="translate(85, 130)">
      <rect x="10" y="10" width="240" height="80" rx="8" fill="url(#safeGlow)"/>

      <!-- 5 Equal-height figures standing side by side -->
      <g fill="#D95D39" stroke="#2C2A29" stroke-width="1.6">
        <circle cx="40" cy="40" r="10"/><rect x="28" y="52" width="24" height="32" rx="4"/>
        <circle cx="85" cy="40" r="10"/><rect x="73" y="52" width="24" height="32" rx="4"/>
        <circle cx="130" cy="40" r="10"/><rect x="118" y="52" width="24" height="32" rx="4"/>
        <circle cx="175" cy="40" r="10"/><rect x="163" y="52" width="24" height="32" rx="4"/>
        <circle cx="220" cy="40" r="10"/><rect x="208" y="52" width="24" height="32" rx="4"/>
      </g>

      <!-- Shared Group Platform Lifting Everyone Together -->
      <rect x="12" y="84" width="236" height="22" rx="5" fill="#F4B942" stroke="#2C2A29" stroke-width="2"/>
      <text x="130" y="99" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="10.5" font-weight="bold" fill="#2C2A29">
        ⬆️  SHARED GROUP LIFT (FAIRNESS FOR ALL)  ⬆️
      </text>
    </g>

    <text x="215" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="11.5" fill="#2C2A29">
      Everyone stands at the <tspan font-weight="bold" fill="#2E7D32">same safe height</tspan>, lifted together!
    </text>
  </g>
</svg>